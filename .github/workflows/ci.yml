name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Go Vet
        run: go vet ./...

      - name: Go Test (Race)
        run: go test -race -v ./...

      - name: Build Binary
        run: make build

      - name: Smoke Test CLI
        run: |
          ./bin/rayneo -version
          ./bin/rayneo help --json > /dev/null

  cloudflare-broker-and-loon:
    name: Cloudflare Worker Broker & Loon Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: broker/cloudflare/package-lock.json

      - name: Install Cloudflare Worker Dev Dependencies
        working-directory: broker/cloudflare
        run: npm ci

      - name: Typecheck, Test & Dry-Run Bundle
        working-directory: broker/cloudflare
        run: npm run check

      - name: Audit Cloudflare Worker Dependencies
        working-directory: broker/cloudflare
        run: npm audit --audit-level=moderate

      - name: Test Loon Passive Sync Script
        run: node --test loon/rayneo-token-sync.test.mjs
